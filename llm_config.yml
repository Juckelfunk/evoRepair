default: phi4_local
llms:
  #### Docker ####
  phi4_docker:
    provider: ollama
    model: "phi4"
    api_base: "http://host.docker.internal:11434/"
  gemma3_docker:
    provider: ollama
    model: "gemma3:1b"
    api_base: "http://host.docker.internal:11434/"
  deepseek_r1_docker:
    provider: ollama
    model: "deepseek-r1:14b"
    api_base: "http://host.docker.internal:11434/"

  #### Local ####
  phi4_local:
    provider: ollama
    model: "phi4"
    api_base: "http://localhost:11434/"
  gemma3_local:
    provider: ollama
    model: "gemma3:1b"
    api_base: "http://localhost:11434/"
  deepseek_r1_local:
    provider: ollama
    model: "deepseek-r1:14b"
    api_base: "http://localhost:11434/"

  #### External ####
  gemini_2_0_flash:
    provider: gemini
    model: "gemini-2.0-flash"
    api_key_env: "GEMINI_API_KEY"
  gemini_2_5_pro:
    provider: gemini
    model: "gemini-2.5-pro-preview-03-25"
    api_key_env: "GEMINI_API_KEY"
  gpt_4o_mini:
    provider: openai
    model: gpt-4o-mini
    #api_key_env: "OPENAI_API_KEY"
  o3_mini:
    provider: openai
    model: o3-mini
    api_key_env: "OPENAI_API_KEY"
