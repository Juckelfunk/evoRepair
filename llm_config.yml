default: gemma3_local
llms:
  #### Docker ####

  phi4_docker:
    provider: ollama
    model: "phi4"
    api_base: "http://host.docker.internal:11434/"
  phi4_r_docker:
    provider: ollama
    model: "phi4-reasoning"
    api_base: "http://host.docker.internal:11434/"
  gemma3_docker:
    provider: ollama
    model: "gemma3:1b"
    api_base: "http://host.docker.internal:11434/"
  r1_docker:
    provider: ollama
    model: "deepseek-r1:14b"
    api_base: "http://host.docker.internal:11434/"
  qwen_docker:
    provider: ollama
    model: "qwen3:14b"
    api_base: "http://host.docker.internal:11434/"


  #### Local ####

  phi4_local:
    provider: ollama
    model: "phi4"
    api_base: "http://localhost:11434/"
  phi4_r_local:
    provider: ollama
    model: "phi4-reasoning"
    api_base: "http://localhost:11434/"
  gemma3_local:
    provider: ollama
    model: "gemma3:1b"
    api_base: "http://localhost:11434/"
  r1_local:
    provider: ollama
    model: "deepseek-r1:14b"
    api_base: "http://localhost:11434/"
  qwen_local:
    provider: ollama
    model: "qwen3:14b"
    api_base: "http://localhost:11434/"


  #### External ####

  2_0_flash:
    provider: gemini
    model: "gemini-2.0-flash"
    api_key_env: "GEMINI_API_KEY"
  1_5_pro:
    provider: gemini
    model: "gemini-1.5-pro"
    api_key_env: "GEMINI_API_KEY"
  2_5_flash:
    provider: gemini
    model: "gemini-2.5-flash-preview-04-17"
    api_key_env: "GEMINI_API_KEY"
  2_5_pro:
    provider: gemini
    model: "gemini-2.5-pro-preview-03-25"
    api_key_env: "GEMINI_API_KEY"

  4o_mini:
    provider: openai
    model: gpt-4o-mini
    #api_key_env: "OPENAI_API_KEY"
  o4_mini:
    provider: openai
    model: o4-mini
    api_key_env: "OPENAI_API_KEY"
